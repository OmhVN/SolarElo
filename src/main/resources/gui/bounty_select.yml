# Select Target Player GUI Configuration (Giao diện Chọn Người chơi để Săn thưởng)
enabled: true
title: "sᴇʟᴇᴄᴛ ᴛᴀʀɢᴇᴛ"
rows: 6

# Filler items (Vật phẩm lót ô trống)
filler:
  enabled: false
  material: "GRAY_STAINED_GLASS_PANE"

# Target player head display (Hiển thị đầu người chơi mục tiêu)
player-head:
  name: "&c{target}"
  lore:
    - "&7Elo: &e{target_elo}"
    - "&7Current Bounty: &a{target_bounty}"
    - ""
    - "&eClick to place bounty on this player!"

# Navigation buttons (Các nút chuyển trang & quay lại)
buttons:
  back:
    slot: 45
    material: "ARROW"
    name: "&cʙᴀᴄᴋ"
    lore-page-1:
      - "&7Return to bounty menu"
    lore-pages:
      - "&7Go to page {prev_page}"

  next:
    slot: 53
    material: "ARROW"
    name: "&aɴᴇxᴛ"
    lore:
      - "&7Go to page {next_page}"
