# Bounty Quest GUI Configuration (Nhiệm vụ Săn thưởng)
enabled: true
gui-disposition:
  - "xxxxxxxxx"
  - "xxxxxxxxx"
  - "xxxxxxxxx"
  - "xxxxxxxxx"
  - "xxxxxxxxx"
  - "b##arf##n"
title: "ʙᴏᴜɴᴛʏ ʟɪsᴛ"


filler:
  enabled: false
  material: "GRAY_STAINED_GLASS_PANE"

minimum-target-elo: 0 # Minimum Elo required for a player to appear on the Bounty target selection menu
minimum-unlock-elo: 0 # Minimum Elo required for a player to use/unlock the Bounty feature

# Item shown for each online player in the bounty selection GUI
target-player-head:
  name: "&cᴛᴀʀɢᴇᴛ: &f{player}"
  lore:
    - "&7Elo: &e{elo}"
    - "&7Rank: &f{rank}"
    - "&7Bounty: &a{bounty}"
    - ""
    - "&fClick to view or place bounty on this player!"

# When player has an active target (Khi đang có nhiệm vụ hoạt động)
active-bounty-item:
  name: "&aᴀᴄᴛɪᴠᴇ ǫᴜᴇsᴛ"
  material: "PLAYER_HEAD"
  lore:
    - "&7Target: &c{target}"
    - "&7Reward Elo: &a+{reward_elo}"
    - "&7Time Remaining: &e{time_remaining}"
    - ""
    - "&fFind and eliminate &e{target} &fto get rewards!"
    - "&fIf they log out, the contract is preserved."

cancel-bounty-item:
  name: "&cᴄᴀɴᴄᴇʟ ǫᴜᴇsᴛ"
  material: "BARRIER"
  lore:
    - "&fClick to cancel the current bounty contract."
    - "&fYou will be penalized with a &c{cooldown} second &fcooldown"
    - "&fbefore you can accept another quest."
  confirm_sound: error

cooldown-item:
  name: "&cᴄᴏᴏʟᴅᴏᴡɴ"
  material: "CLOCK"
  lore:
    - "&fYou completed or canceled a quest recently."
    - "&fPlease wait before accepting the next quest."
    - ""
    - "&fRemaining time: &c{remaining} seconds."

no-targets-item:
  name: "&cɴᴏ ᴠᴀʟɪᴅ ᴛᴀʀɢᴇᴛs"
  material: "PAPER"
  lore:
    - "&fNo other valid players online currently."
    - "&f(You cannot target yourself)"

locked-item:
  name: "&cʙᴏᴜɴᴛʏ ʟᴏᴄᴋᴇᴅ"
  material: "BARRIER"
  lore:
    - "&fYou need at least &e{required} Elo &fto unlock"
    - "&fthe Bounty feature."
    - ""
    - "&7Your current Elo: &c{elo} Elo"

back:
  name: "&cʙᴀᴄᴋ"
  lore:
    - "&fClick to go to the previous page"
  material: "ARROW"
  customModelData: -1

next:
  name: "&aɴᴇxᴛ"
  lore:
    - "&fClick to go to the next page"
  material: "ARROW"
  customModelData: -1

active-quest:
  name: "&fᴀᴄᴛɪᴠᴇ ǫᴜᴇsᴛ"
  lore:
    - "&fClick to view current contract details"
    - "&fand remaining time."
  material: "BLUE_BANNER"
  customModelData: -1

refresh:
  name: "&fʀᴇꜰʀᴇsʜ"
  lore:
    - "&fClick to refresh the targets list"
  material: "ANVIL"
  customModelData: -1

filter:
  name: "&fғɪʟᴛᴇʀ"
  material: "HOPPER"
  customModelData: -1
  selected_color: "&e"
  unselected_color: "&f"
  bullet_icon: "▪ "
  options: # DON'T CHANGE ANYTHING IN HERE
    - "HIGH_TO_LOW"
    - "LOW_TO_HIGH"
  option-names:
    HIGH_TO_LOW: "High to Low (Top)"
    LOW_TO_HIGH: "Low to High (Bottom)"
  lore:
    - "&fFilter state:"
    - "{options}"
    - ""
    - "&fClick to change filter!"

config-version: "1.5"
