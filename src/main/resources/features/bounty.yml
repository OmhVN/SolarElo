# Bounty System Configuration (Cấu hình Hệ thống Truy Nã / Săn Thưởng)
bounty:
  enabled: true
  # Streak Bounties (Thưởng chuỗi hạ gục)
  streak-bounties:
    "5":
      reward-elo: 20
      commands:
        - "eco give {killer} 500"
    "10":
      reward-elo: 50
      commands:
        - "eco give {killer} 1000"
        - "give {killer} diamond 1"
  # Rank Bounties for defeating leaderboard TOP players (Thưởng hạ gục TOP bảng xếp hạng)
  top-player-bounties:
    "1":
      reward-elo: 50
      commands:
        - "eco give {killer} 2000"
    "2":
      reward-elo: 30
      commands:
        - "eco give {killer} 1000"
    "3":
      reward-elo: 20
      commands:
        - "eco give {killer} 500"

# Contract quest settings (Cài đặt khế ước nhiệm vụ săn thưởng)
bounty-quest:
  reward-elo: 20
  contract-duration-seconds: 5400 # 1 hour 30 minutes contract duration (Thời gian hiệu lực khế ước 1h30m)
  cooldown-seconds: 5400 # 1 hour 30 minutes cooldown after completion (Thời gian chờ sau khi hoàn thành 1h30m)
  cancel-cooldown-seconds: 300 # 5 minutes cooldown after cancellation (Thời gian chờ sau khi hủy khế ước 5m)
  commands:
    - "give {killer} diamond 2"

config-version: "1.5"
